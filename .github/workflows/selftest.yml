# CI for the kit. The repository root holds README.md, tests/, docs/ and the .claude/ kit.
# Verified on 2026-10-07 on a copy laid out this way, with Python 3.14.5 only: validate.py gives 0 errors,
# selftest.py gives 12 of 12 modules OK, and tests/lint_py39.py gives 0 findings.
# NOT verified in this build: the Python 3.9 and 3.13 jobs, and the macOS arm64 runner. Python 3.9 may not be
# offered by actions/setup-python on macos-latest (arm64). If the macOS Python 3.9 job fails at
# "Install Python", remove that one combination from the matrix below and add
# "macos-latest" with python "3.10" instead. The other steps stay the same.
name: selftest

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    name: ${{ matrix.os }} with Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    env:
      PYTHONUTF8: "1"
      TUTOR_SELFTEST_TIME_FACTOR: "3"
      TUTOR_SELFTEST_LATENCY_MS: "750"
    steps:
      - name: Get the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Check the kit files
        run: python .claude/tools/validate.py

      - name: Run the self-tests
        run: python .claude/tools/selftest.py

      - name: Check the test code for features newer than Python 3.9
        run: python tests/lint_py39.py
